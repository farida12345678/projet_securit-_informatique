services:
  web:
    build: .
    ports:
      - "8089:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=secureblog_vuln
      - DB_USER=secureblog
      - DB_PASS=secureblog123

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: secureblog_vuln
      POSTGRES_USER: secureblog
      POSTGRES_PASSWORD: secureblog123
    ports:
      - "5434:5432"
    volumes:
      - pgdata_secure:/var/lib/postgresql/data

  # Add this new section:
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - db

volumes:
  pgdata_secure: