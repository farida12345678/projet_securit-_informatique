services:
  web:
    image: php:8.2-apache
    container_name: web_securite
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    restart: always

  db:
    image: mysql:8.0
    container_name: db_securite
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: db_projet
    ports:
      - "3306:3306"
    restart: always

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_securite
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword
    restart: always